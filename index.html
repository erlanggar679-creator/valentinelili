<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Be Felt</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      background: #000;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* SLIDESHOW */
    .slideshow {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .slide.active {
      opacity: 1;
    }

    /* OVERLAY */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .card {
      max-width: 700px;
      padding: 30px;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    #text {
      font-size: 1.2rem;
      line-height: 1.8;
      min-height: 150px;
      transition: opacity 1s ease;
    }

    /* HEARTBEAT */
    .heartbeat {
      animation: beat 0.6s ease;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      30% { transform: scale(1.03); }
      60% { transform: scale(0.98); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- SLIDESHOW -->
    <div class="slideshow">
      <img src="foto1.jpg" class="slide active">
      <img src="foto2.jpg" class="slide">
      <img src="foto3.jpg" class="slide">
      <img src="foto4.jpg" class="slide">
    </div>

    <!-- TEXT -->
    <div class="overlay">
      <div class="card">
        <h1>Just Stay</h1>
        <div id="text"></div>
      </div>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll(".slide");
    const textEl = document.getElementById("text");
    const card = document.querySelector(".card");

    const loveTexts = [
      `This page is not meant<br>
       to be scrolled.<br>
       It is meant to be felt.`,

      `Some moments<br>
       don’t need explanations.<br>
       They just need presence.`,

      `With you,<br>
       everything feels quieter,<br>
       softer,<br>
       real.`,

      `If love had a place,<br>
       maybe it would look like this.<br><br>
       And I would stay here.<br>
       With you. ❤️`
    ];

    let currentSlide = 0;

    function typeText(element, text, speed = 40) {
      element.innerHTML = "";
      element.style.opacity = 1;
      let i = 0;

      const typing = setInterval(() => {
        if (i < text.length) {
          element.innerHTML += text.charAt(i);
          i++;
        } else {
          clearInterval(typing);
        }
      }, speed);
    }

    function startSlideshow() {
      typeText(textEl, loveTexts[0]);

      setInterval(() => {
        slides[currentSlide].classList.remove("active");
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add("active");

        textEl.style.opacity = 0;

        setTimeout(() => {
          typeText(textEl, loveTexts[currentSlide]);
          card.classList.add("heartbeat");
          setTimeout(() => card.classList.remove("heartbeat"), 600);
        }, 1000);

      }, 5000);
    }

    startSlideshow();
  </script>

</body>
</html>
